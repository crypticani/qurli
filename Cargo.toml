[package]
name = "qurli"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Lightweight terminal UI HTTP client"
repository = "https://github.com/crypticani/qurli"
homepage = "https://github.com/crypticani/qurli"
readme = "README.md"
keywords = ["http", "curl", "tui", "terminal", "api"]
categories = ["command-line-utilities"]
authors = ["crypticani"]

[[bin]]
name = "qurli"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.3"
clap = { version = "4.5", features = ["derive"] }
tui-textarea = "0.7"
dirs = "5.0"
futures = "0.3"
